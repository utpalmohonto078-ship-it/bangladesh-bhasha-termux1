<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>বাংলাদেশ ভাষা IDE</title>
<style>
body{font-family:sans-serif;margin:0;padding:12px;background:#0f1720;color:#e6edf3}
h1{font-size:18px;margin:0 0 10px}
textarea{width:100%;height:42vh;box-sizing:border-box;font-family:monospace;font-size:15px;
 background:#161f2b;color:#e6edf3;border:1px solid #2d3b4d;border-radius:6px;padding:8px}
button,select{font-size:15px;padding:8px 14px;margin:8px 6px 8px 0;border-radius:6px;border:0}
button{background:#1f9d55;color:#fff}
button.alt{background:#3b82f6}
pre{background:#0a0f16;border:1px solid #2d3b4d;border-radius:6px;padding:10px;min-height:80px;
 white-space:pre-wrap;word-break:break-word}
.err{color:#ff7b72}
</style>
</head>
<body>
<h1>BANGLADESH BHASHA — Web IDE</h1>
<select id="ex"><option value="">উদাহরণ বাছুন</option></select>
<textarea id="code" spellcheck="false" placeholder="এখানে আপনার .bb কোড লিখুন"></textarea>
<div>
<button onclick="go('run')">▶ Run</button>
<button class="alt" onclick="go('check')">✔ Check</button>
</div>
<pre id="out">আউটপুট এখানে আসবে</pre>
<script>
const code=document.getElementById('code'),out=document.getElementById('out'),ex=document.getElementById('ex');
let examples={};
fetch('/api/examples').then(r=>r.json()).then(d=>{
  examples=d;
  for(const k in d){const o=document.createElement('option');o.value=k;o.textContent=k;ex.appendChild(o);}
});
ex.onchange=()=>{if(ex.value)code.value=examples[ex.value];};
async function go(kind){
  out.className='';out.textContent='চলছে...';
  try{
    const r=await fetch('/api/'+kind,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:code.value})});
    const d=await r.json();
    out.className=d.ok?'':'err';
    out.textContent=d.output||(d.ok?'(কোনো আউটপুট নেই)':'ত্রুটি');
  }catch(e){out.className='err';out.textContent='সার্ভারে যোগাযোগ হয়নি: '+e;}
}
</script>
</body>
</html>
